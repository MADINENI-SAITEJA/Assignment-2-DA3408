apiVersion: batch/v1
kind: Job

metadata:
  name: signup-validator

spec:
  completions: 8

  parallelism: 4

  completionMode: Indexed

  backoffLimit: 2

  activeDeadlineSeconds: 600

  template:

    metadata:
      labels:
        app: signup-validator

    spec:

      restartPolicy: Never

      containers:

        - name: validator

          image: signup-validator:v1

          imagePullPolicy: IfNotPresent

          env:

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOLD_SECONDS
              value: "40"

          resources:

            requests:
              cpu: "550m"

            limits:
              cpu: "550m"
