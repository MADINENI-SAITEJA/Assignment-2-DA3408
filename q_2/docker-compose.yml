services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.multistage

    image: spam-api:q2

    ports:
      - "8000:8000"

    environment:
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_TTL: "300"

    depends_on:
      cache:
        condition: service_healthy


  cache:
    image: redis:7-alpine

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10